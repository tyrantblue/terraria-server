services:
  terraria:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terraria
    restart: unless-stopped

    ports:
      - "7777:7777/tcp"
      - "7777:7777/udp"

    volumes:
      - ./config:/configs
      - ./worlds:/worlds
      - ./control:/control
      - ./start.sh:/start.sh:ro

    entrypoint:
      - /start.sh

    environment:
      # 日志时间戳与游戏自身报错的时区（容器默认 UTC，显式指定避免"凌晨 5 点"变中午）
      TZ: "${TZ:-Asia/Shanghai}"

    stdin_open: true
    tty: true

  terraria-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: terraria-api
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      - ./control:/opt/terraria/control
      - ./config:/opt/terraria/config
      - ./worlds:/opt/terraria/worlds
      # 备份必须落在宿主机上（API 的 /api/v1/worlds/{file}/backup 会写这里）。
      # 少挂这一条时备份会写进容器可写层，容器一重建就没了。
      - ./backup:/opt/terraria/backup

    environment:
      # 日志时间戳/备份目录名/定时任务都用这个时区（容器默认 UTC）
      TZ: "${TZ:-Asia/Shanghai}"
      TERRARIA_LOG_TZ: "${TZ:-Asia/Shanghai}"
      # ---- 定时任务（见 docs/roadmap.md；实现于 app/services/scheduler.py）----
      SCHEDULE_ENABLED: "1"
      SCHEDULE_TZ: "${TZ:-Asia/Shanghai}"
      SCHEDULE_SAVE_MINUTES: "15"        # 每 15 分钟保存（没人在线自动跳过）
      SCHEDULE_SAVE_SKIP_EMPTY: "1"
      SCHEDULE_BACKUP_HOURS: "6"         # 每 6 小时自动备份
      SCHEDULE_BACKUP_KEEP: "10"         # 只保留最近 10 份（pre-restore 安全副本不清理）
      SCHEDULE_RESTART_AT: "05:00"       # 每天 05:00（SCHEDULE_TZ）重启；留空 = 关闭
      SCHEDULE_RESTART_SKIP_IF_PLAYERS: "1"
      SCHEDULE_RESTART_WARN_MINUTES: "5"
      # ---- 事件通知（webhook）；留空即关闭 ----
      NOTIFY_WEBHOOK_URL: ""
      NOTIFY_FORMAT: "auto"              # auto | discord | slack | json
      NOTIFY_EVENTS: ""                  # 逗号分隔；空 = 全部

  # ---------------------------------------------------------------------------
  # 连接守卫：把扫描/探测连接挡在 7777 之外，并在“假满员”时自动恢复。
  # 说明见 README 第 28 节，原理/证据见 docs/connection-guard.md。
  #
  # 必须在宿主机网络命名空间里操作 netfilter，所以用 network_mode: host +
  # NET_ADMIN（不是 privileged）。因此它不能加入 compose 的默认网络。
  # 不需要 ports、不需要 depends_on：DOCKER-USER 链在 dockerd 启动时就存在，
  # 守护脚本内部也会等待该链出现。
  # ---------------------------------------------------------------------------
  terraria-guard:
    build:
      context: ./guard
      dockerfile: Dockerfile
    container_name: terraria-guard
    restart: unless-stopped

    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW

    volumes:
      - ./guard:/opt/terraria/guard
      - ./control:/opt/terraria/control

    environment:
      TERRARIA_PORT: "7777"
      MAX_CONN_PER_IP: "4"          # 单 IP 同时连接数上限
      NEW_CONN_RATE: "10/min"       # 单 IP 新建连接速率上限
      NEW_CONN_BURST: "10"
      ALLOWLIST_ONLY: "0"           # 1 = 只放行白名单
      # 成功登录自动加白名单（学习型），详见 README 28.3
      LEARN_ALLOW: "1"
      LEARN_DWELL: "60"             # 至少在线 60 秒才学习（0=登录即学习）
      LEARN_TTL: "604800"           # 白名单有效期 7 天（0=永久）
      LEARN_MAX: "200"
