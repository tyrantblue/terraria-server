name: api

on:
  push:
    paths:
      - "api/**"
      - "guard/**"
      - "docs/api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"
      - "guard/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (uv.lock is the source of truth)
        run: uv sync --frozen

      - name: Run tests
        run: uv run --frozen pytest -q

      # 契约闸门：接口改了但 api/openapi.json 快照没更新 → 直接失败，
      # 避免「代码变了文档没变」。确认改动是有意的就本地跑
      #   uv run python scripts/export_openapi.py
      # 并在 docs/api/CHANGELOG.md 里记一笔。
      - name: Check OpenAPI snapshot
        run: uv run --frozen python scripts/export_openapi.py --check
